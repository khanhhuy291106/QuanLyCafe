# ===== Cấu hình kết nối SQL Server (SQL Authentication) =====
# Sửa lại cho đúng máy của bạn, lưu file rồi chạy lại chương trình.
db.host=localhost
db.port=1433
# Nếu dùng SQL Server Express có tên instance (ví dụ SQLEXPRESS) thì điền vào đây, khi đó bỏ qua db.port.
db.instance=
db.name=QuanLyCafe
db.user=sa
db.password=123456
# Đặt false nếu SQL Server quá cũ (2012 trở xuống) và báo lỗi TLS/SSL khi kết nối.
db.encrypt=true
